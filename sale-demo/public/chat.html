<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anvil 智能助手</title>
  <script src="/tracker/portal-tracker.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
      background: #f0f4f8;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }

    /* ── 顶部标题栏 ── */
    #header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff; padding: 12px 20px;
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    #header .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    #header .info { flex: 1; }
    #header h1 { font-size: 15px; font-weight: 600; }
    #header p  { font-size: 11px; opacity: .75; margin-top: 1px; }
    #identity-badge {
      font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600;
      background: rgba(255,255,255,.2);
    }
    #status-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
      flex-shrink: 0; box-shadow: 0 0 6px #4ade80;
    }
    #status-dot.human { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }

    /* ── 消息列表 ── */
    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }

    .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 82%; }
    .msg.bot      { align-self: flex-start; }
    .msg.user     { align-self: flex-end; flex-direction: row-reverse; }
    .msg.operator { align-self: flex-start; }
    .msg.system   { align-self: center; max-width: 100%; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #dbeafe; display: flex; align-items: center;
      justify-content: center; font-size: 16px; flex-shrink: 0;
    }
    .msg.operator .msg-avatar { background: #fef3c7; }

    .msg-bubble {
      padding: 10px 14px; border-radius: 16px;
      font-size: 14px; line-height: 1.6; word-break: break-word;
    }
    .msg.bot      .msg-bubble { background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
    .msg.operator .msg-bubble { background: #fffbeb; border: 1px solid #fcd34d; border-bottom-left-radius: 4px; color: #92400e; }
    .msg.user     .msg-bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .msg.system   .msg-bubble {
      background: #f1f5f9; color: #64748b; font-size: 12px;
      text-align: center; border-radius: 20px; padding: 5px 16px; border: none;
    }

    /* Markdown 样式 */
    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
      font-size: 14px; font-weight: 700; margin: 8px 0 4px;
    }
    .msg-bubble h1 { font-size: 16px; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin: 4px 0; }
    .msg-bubble li { margin: 2px 0; }
    .msg-bubble table {
      border-collapse: collapse; width: 100%; font-size: 12px; margin: 8px 0;
    }
    .msg-bubble th, .msg-bubble td {
      border: 1px solid #e2e8f0; padding: 5px 10px; text-align: left;
    }
    .msg-bubble th { background: #f1f5f9; font-weight: 600; }
    .msg-bubble tr:nth-child(even) td { background: #f8fafc; }
    .msg-bubble code {
      background: #f1f5f9; padding: 1px 4px; border-radius: 3px; font-size: 0.9em;
    }
    .msg-bubble p { margin: 4px 0; }

    .streaming::after { content: "▋"; animation: blink 0.7s infinite; color: #2563eb; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── 思考过程块 ── */
    .thinking-block {
      align-self: flex-start; max-width: 82%;
      display: flex; flex-direction: column;
      background: #faf5ff; border: 1px solid #d8b4fe;
      border-left: 3px solid #9333ea;
      border-radius: 10px;
      font-size: 12px;
    }
    .thinking-header {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; cursor: pointer; user-select: none;
      color: #7e22ce; font-weight: 600;
    }
    .thinking-header:hover { background: #f3e8ff; }
    .thinking-toggle { font-size: 10px; margin-left: auto; color: #a855f7; }
    .thinking-body {
      padding: 8px 12px; border-top: 1px solid #e9d5ff;
      color: #6b21a8; line-height: 1.6; white-space: pre-wrap;
      word-break: break-word; max-height: 240px; overflow-y: auto;
      font-family: ui-monospace, monospace; font-size: 11.5px;
    }
    .thinking-block.collapsed .thinking-body { display: none; }
    .thinking-spinner {
      width: 10px; height: 10px; border: 2px solid #d8b4fe;
      border-top-color: #9333ea; border-radius: 50%;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }

    /* ── 工具调用卡片 ── */
    .tool-card {
      align-self: flex-start; max-width: 82%;
      display: flex; flex-direction: column;
      background: #f0fdf4; border: 1px solid #86efac;
      border-left: 3px solid #16a34a;
      border-radius: 10px; font-size: 12px;
    }
    .tool-card.error { background: #fef2f2; border-color: #fca5a5; border-left-color: #dc2626; }
    .tool-card-header {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 10px; color: #15803d; font-weight: 600;
    }
    .tool-card.error .tool-card-header { color: #dc2626; }
    .tool-status { font-size: 10px; color: #22c55e; margin-left: auto; }
    .tool-card.error .tool-status { color: #ef4444; }
    .tool-spinner {
      width: 10px; height: 10px; border: 2px solid #86efac;
      border-top-color: #16a34a; border-radius: 50%;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    .tool-section {
      border-top: 1px solid #bbf7d0; padding: 6px 10px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .tool-card.error .tool-section { border-top-color: #fecaca; }
    .tool-section-label {
      font-size: 10px; font-weight: 700; color: #15803d; text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tool-card.error .tool-section-label { color: #dc2626; }
    .tool-args-text {
      color: #374151; font-family: ui-monospace, monospace; font-size: 11px;
      word-break: break-all;
    }
    .tool-result-header {
      display: flex; align-items: center; gap: 4px;
      cursor: pointer; user-select: none;
    }
    .tool-result-header:hover { opacity: 0.75; }
    .tool-result-body {
      margin-top: 4px; color: #374151; white-space: pre-wrap;
      word-break: break-word; max-height: 160px; overflow-y: auto;
      font-size: 11px; font-family: ui-monospace, monospace;
    }
    .tool-result-body.hidden { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 留资表单 ── */
    .form-card {
      background: #fff; border: 1px solid #bfdbfe;
      border-radius: 16px; padding: 16px; max-width: 380px; align-self: flex-start;
    }
    .form-card h3 { font-size: 14px; font-weight: 600; color: #1e3a8a; margin-bottom: 4px; }
    .form-card p  { font-size: 12px; color: #64748b; margin-bottom: 12px; }
    .form-field { margin-bottom: 10px; }
    .form-field label { display: block; font-size: 12px; color: #374151; font-weight: 500; margin-bottom: 3px; }
    .form-field label .req { color: #ef4444; margin-left: 2px; }
    .form-field input, .form-field textarea {
      width: 100%; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s;
    }
    .form-field input:focus, .form-field textarea:focus { border-color: #2563eb; }
    .form-field textarea { height: 64px; resize: none; }
    .form-submit {
      width: 100%; padding: 9px; background: #2563eb; color: #fff;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; margin-top: 4px; transition: background .15s;
    }
    .form-submit:hover { background: #1d4ed8; }
    .form-submit:disabled { background: #93c5fd; cursor: default; }

    /* ── 确认对话框 ── */
    .confirm-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
      padding: 14px; max-width: 360px; align-self: flex-start;
    }
    .confirm-card .q { font-size: 13px; color: #374151; margin-bottom: 10px; font-weight: 500; }
    .confirm-options { display: flex; flex-wrap: wrap; gap: 6px; }
    .confirm-option {
      padding: 6px 14px; border: 1.5px solid #bfdbfe; border-radius: 20px;
      font-size: 12px; color: #1e40af; background: #eff6ff;
      cursor: pointer; transition: all .15s;
    }
    .confirm-option:hover { background: #2563eb; color: #fff; border-color: #2563eb; }
    .confirm-other-wrap { margin-top: 8px; display: flex; gap: 6px; }
    .confirm-other-wrap input {
      flex: 1; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 12px; outline: none;
    }
    .confirm-other-wrap input:focus { border-color: #2563eb; }
    .confirm-other-wrap button {
      padding: 6px 12px; background: #2563eb; color: #fff;
      border: none; border-radius: 8px; font-size: 12px; cursor: pointer;
    }

    /* ── 人工服务横幅 ── */
    #human-banner {
      display: none; background: #fef3c7; border-top: 1px solid #fcd34d;
      padding: 8px 16px; font-size: 12px; color: #92400e;
      text-align: center; flex-shrink: 0;
    }
    #human-banner.show { display: flex; align-items: center; justify-content: center; gap: 8px; }
    #human-banner button {
      font-size: 11px; padding: 2px 8px; border: 1px solid #d97706;
      border-radius: 10px; background: transparent; color: #92400e;
      cursor: pointer;
    }

    /* ── 输入区 ── */
    #input-area { border-top: 1px solid #e2e8f0; background: #fff; padding: 12px 16px; flex-shrink: 0; }
    #input-row { display: flex; gap: 8px; align-items: flex-end; }
    #msg-input {
      flex: 1; border: 1.5px solid #d1d5db; border-radius: 12px;
      padding: 9px 14px; font-size: 14px; font-family: inherit;
      resize: none; max-height: 120px; outline: none; transition: border-color .15s; line-height: 1.4;
    }
    #msg-input:focus { border-color: #2563eb; }
    #msg-input.human-mode { border-color: #fcd34d; background: #fffbeb; }
    #send-btn {
      width: 40px; height: 40px; border-radius: 12px; background: #2563eb; color: #fff;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: all .15s; flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) { background: #1d4ed8; }
    #send-btn:disabled { background: #93c5fd; cursor: default; }

    /* 快捷回复 */
    #quick-replies { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .qr-btn {
      font-size: 12px; padding: 4px 12px; border: 1px solid #bfdbfe;
      border-radius: 16px; background: #eff6ff; color: #1d4ed8;
      cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .qr-btn:hover { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* 线索成功 */
    .lead-success {
      background: #f0fdf4; border: 1px solid #86efac; border-radius: 12px;
      padding: 12px 14px; font-size: 13px; color: #166534;
      align-self: flex-start; max-width: 340px;
    }
    .lead-success strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

<!-- 顶部标题栏 -->
<div id="header">
  <div class="avatar">🤖</div>
  <div class="info">
    <h1 id="header-title">Anvil 智能助手</h1>
    <p id="header-sub">AI 客服 · 实时在线</p>
  </div>
  <span id="identity-badge">访客</span>
  <div id="status-dot"></div>
</div>

<!-- 人工服务横幅 -->
<div id="human-banner">
  🤝 人工客服已接入，正在为您服务
  <button id="btn-ask-ai">切回 AI</button>
</div>

<!-- 消息区 -->
<div id="messages"></div>

<!-- 输入区 -->
<div id="input-area">
  <div id="quick-replies">
    <button class="qr-btn" data-value="我想了解 Anvil 平台的产品功能">📦 产品介绍</button>
    <button class="qr-btn" data-value="能介绍一下价格方案吗？">💰 价格咨询</button>
    <button class="qr-btn" data-value="我需要做 API 集成，怎么对接？">🔗 API 对接</button>
    <button class="qr-btn" id="qr-lead" data-action="lead">📋 留下联系方式</button>
    <button class="qr-btn" data-value="我想和真人客服沟通">👤 转人工</button>
  </div>
  <div id="input-row">
    <textarea id="msg-input" rows="1" placeholder="输入消息…"></textarea>
    <button id="send-btn" title="发送">➤</button>
  </div>
</div>

<script>
// ── 配置 ─────────────────────────────────────────────────────────
const AGENT_BASE   = 'http://localhost:8001';
const TRACKER_BASE = 'http://localhost:8005';

// ── 状态 ─────────────────────────────────────────────────────────
let sessionId      = null;
let visitorId      = localStorage.getItem('pt_visitor_id') || null;
let userType       = 'anonymous';
let humanServing   = false;
let quickRepliesShown = true;
let pollTimer      = null;
let lastMsgIdx     = -1;   // 轮询游标

// ── DOM ──────────────────────────────────────────────────────────
const messagesEl    = document.getElementById('messages');
const inputEl       = document.getElementById('msg-input');
const sendBtn       = document.getElementById('send-btn');
const identityBadge = document.getElementById('identity-badge');
const humanBanner   = document.getElementById('human-banner');
const statusDot     = document.getElementById('status-dot');
const qrContainer   = document.getElementById('quick-replies');

// ── 身份解析 ─────────────────────────────────────────────────────
function resolveIdentity() {
  let sim = window.SIMULATE_IDENTITY || {};
  try {
    const stored = sessionStorage.getItem('pt_simulate_identity');
    if (stored) sim = { ...JSON.parse(stored), ...sim };
  } catch (_) {}
  userType = sim.user_type || 'anonymous';
  if (sim.visitor_id) visitorId = sim.visitor_id;

  const BADGE = {
    anonymous: { label: '访客',    color: '#64748b' },
    same_ip:   { label: '同IP访客', color: '#7c3aed' },
    lead:      { label: '已留资',   color: '#2563eb' },
    member:    { label: '会员',     color: '#059669' },
  };
  const meta = BADGE[userType] || BADGE.anonymous;
  identityBadge.textContent = meta.label;
  identityBadge.style.background = meta.color + '33';
  identityBadge.style.color = meta.color;
  identityBadge.style.border = `1px solid ${meta.color}66`;
}

// ── 会话初始化 ───────────────────────────────────────────────────
async function initSession() {
  resolveIdentity();
  try {
    const res = await fetch(`${AGENT_BASE}/api/sessions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        visitor_id: visitorId,
        user_type: userType,
        member_id: window.SIMULATE_IDENTITY?.member_id || null,
      }),
    });
    const data = await res.json();
    sessionId = data.session_id;
  } catch (e) {
    console.warn('[chat] agent backend unavailable:', e.message);
  }

  const WELCOME = {
    anonymous: '你好！我是 Anvil 智能助手 👋 有什么可以帮您的？',
    same_ip:   '欢迎回来！有什么新问题需要了解吗？',
    lead:      '您好！看到您之前已经留下了联系方式，有什么可以进一步为您介绍的？',
    member:    '您好，尊贵的会员！🌟 有什么专属服务需要我为您安排？',
  };
  appendBotMessage(WELCOME[userType] || WELCOME.anonymous);
}

// ── Markdown 渲染 ────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function inlineFmt(text) {
  return escHtml(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

function parseTableRow(line) {
  return line.split('|').slice(1, -1).map(c => c.trim());
}

function isSeparatorRow(line) {
  return /^\|[-:| ]+\|$/.test(line.trim());
}

function md2html(text) {
  const lines = text.split('\n');
  let html = '';
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // 表格：当前行是表头，下一行是分隔符
    if (
      line.trim().startsWith('|') &&
      i + 1 < lines.length &&
      isSeparatorRow(lines[i + 1])
    ) {
      const headers = parseTableRow(line);
      i += 2; // 跳过表头和分隔符
      html += '<table><thead><tr>' +
              headers.map(h => `<th>${inlineFmt(h)}</th>`).join('') +
              '</tr></thead><tbody>';
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        const cells = parseTableRow(lines[i]);
        html += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      html += '</tbody></table>';
      continue;
    }

    // 标题
    const hm = line.match(/^(#{1,3})\s+(.+)$/);
    if (hm) {
      const level = hm[1].length;
      html += `<h${level}>${inlineFmt(hm[2])}</h${level}>`;
      i++; continue;
    }

    // 无序列表
    if (/^[-*•] /.test(line)) {
      html += '<ul>';
      while (i < lines.length && /^[-*•] /.test(lines[i])) {
        html += `<li>${inlineFmt(lines[i].slice(2))}</li>`;
        i++;
      }
      html += '</ul>';
      continue;
    }

    // 有序列表
    if (/^\d+\.\s/.test(line)) {
      html += '<ol>';
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) {
        html += `<li>${inlineFmt(lines[i].replace(/^\d+\.\s/, ''))}</li>`;
        i++;
      }
      html += '</ol>';
      continue;
    }

    // 空行
    if (line.trim() === '') { html += '<br>'; i++; continue; }

    // 普通段落
    html += `<p>${inlineFmt(line)}</p>`;
    i++;
  }
  return html;
}

// ── 消息渲染 ─────────────────────────────────────────────────────
function appendBotMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble">${md2html(text)}</div>`;
  messagesEl.appendChild(div);
  scrollBottom();
  return div.querySelector('.msg-bubble');
}

function appendUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
  messagesEl.appendChild(div);
  scrollBottom();
}

function appendOperatorMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg operator';
  div.innerHTML = `<div class="msg-avatar">👤</div><div class="msg-bubble">${escHtml(text)}</div>`;
  messagesEl.appendChild(div);
  scrollBottom();
}

function appendSystemMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
  messagesEl.appendChild(div);
  scrollBottom();
}

// ── 思考过程块 ───────────────────────────────────────────────────
function createThinkingBlock() {
  const el = document.createElement('div');
  el.className = 'thinking-block';
  el.innerHTML = `
    <div class="thinking-header">
      <div class="thinking-spinner"></div>
      <span class="thinking-label">🧠 思考中…</span>
      <span class="thinking-toggle">▾</span>
    </div>
    <div class="thinking-body"></div>`;
  messagesEl.appendChild(el);
  scrollBottom();

  el.querySelector('.thinking-header').addEventListener('click', () => {
    el.classList.toggle('collapsed');
    el.querySelector('.thinking-toggle').textContent =
      el.classList.contains('collapsed') ? '▸' : '▾';
  });
  return el;
}

function thinkingAppend(el, delta) {
  el.querySelector('.thinking-body').textContent += delta;
  scrollBottom();
}

function thinkingDone(el) {
  const spinner = el.querySelector('.thinking-spinner');
  if (spinner) { spinner.style.animation = 'none'; spinner.style.borderTopColor = '#a855f7'; }
  el.querySelector('.thinking-label').textContent = '🧠 思考过程';
  el.classList.add('collapsed');
  el.querySelector('.thinking-toggle').textContent = '▸';
}

// ── 工具调用卡片 ──────────────────────────────────────────────────
const TOOL_LABELS = {
  rag_search:               { icon: '🔍', name: '检索知识库' },
  web_search:               { icon: '🌐', name: '搜索网络' },
  lead_capture_form:        { icon: '📋', name: '生成留资表单' },
  confirm_dialog:           { icon: '🤔', name: '生成确认选项' },
  request_human_handoff:    { icon: '🤝', name: '联系人工客服' },
  analyze_visitor_intent:   { icon: '🔬', name: '分析访客意向' },
  Skill:                    { icon: '📖', name: '读取技能指南' },
};

function createToolCard(toolName, toolId) {
  const meta = TOOL_LABELS[toolName] || { icon: '⚙️', name: toolName };
  const el = document.createElement('div');
  el.className = 'tool-card';
  el.dataset.toolId = toolId;
  el.innerHTML = `
    <div class="tool-card-header">
      <div class="tool-spinner"></div>
      <span>${meta.icon} ${meta.name}</span>
      <span class="tool-status">执行中…</span>
    </div>`;
  messagesEl.appendChild(el);
  scrollBottom();
  return el;
}

function toolCardSetArgs(el, argsStr) {
  // 尝试格式化 JSON
  let display = argsStr;
  try {
    const obj = JSON.parse(argsStr);
    display = Object.entries(obj)
      .map(([k, v]) => `${k}: ${JSON.stringify(v)}`)
      .join('\n');
  } catch (_) {}
  const section = document.createElement('div');
  section.className = 'tool-section';
  section.innerHTML = `<div class="tool-section-label">参数</div>
    <div class="tool-args-text">${escHtml(display)}</div>`;
  el.appendChild(section);
}

function toolCardSetResult(el, resultText) {
  const spinner = el.querySelector('.tool-spinner');
  if (spinner) spinner.remove();
  el.querySelector('.tool-status').textContent = '✅ 完成';

  const section = document.createElement('div');
  section.className = 'tool-section';
  const header = document.createElement('div');
  header.className = 'tool-result-header';
  header.innerHTML = `<div class="tool-section-label">结果</div><span style="font-size:10px;color:#15803d;margin-left:auto">▾ 展开</span>`;
  const body = document.createElement('div');
  body.className = 'tool-result-body hidden';
  body.textContent = resultText;
  section.appendChild(header);
  section.appendChild(body);
  el.appendChild(section);

  const toggle = header.querySelector('span');
  header.addEventListener('click', () => {
    body.classList.toggle('hidden');
    toggle.textContent = body.classList.contains('hidden') ? '▾ 展开' : '▴ 折叠';
  });
  scrollBottom();
}

function toolCardError(el) {
  el.classList.add('error');
  const spinner = el.querySelector('.tool-spinner');
  if (spinner) spinner.remove();
  el.querySelector('.tool-status').textContent = '❌ 失败';
}

// 留资表单
function renderForm(spec) {
  const card = document.createElement('div');
  card.className = 'form-card';
  const fields = spec.fields || [];
  const required = new Set(spec.required_fields || []);
  let html = `<h3>📋 留下联系方式</h3><p>${escHtml(spec.intro || '')}</p>`;
  for (const f of fields) {
    const req = required.has(f.id) ? '<span class="req">*</span>' : '';
    if (f.type === 'textarea') {
      html += `<div class="form-field"><label>${escHtml(f.label)}${req}</label>
        <textarea id="lf-${f.id}" placeholder="${escHtml(f.placeholder||'')}">${escHtml(f.value||'')}</textarea></div>`;
    } else {
      html += `<div class="form-field"><label>${escHtml(f.label)}${req}</label>
        <input type="${f.type}" id="lf-${f.id}" placeholder="${escHtml(f.placeholder||'')}" value="${escHtml(f.value||'')}"></div>`;
    }
  }
  html += `<button class="form-submit" id="lf-submit">${escHtml(spec.submit_label||'提交')}</button>`;
  card.innerHTML = html;
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.appendChild(card);
  messagesEl.appendChild(div);
  scrollBottom();

  card.querySelector('#lf-submit').addEventListener('click', async () => {
    const data = {};
    let valid = true;
    for (const f of fields) {
      const el = card.querySelector(`#lf-${f.id}`);
      if (el) {
        data[f.id] = el.value.trim();
        if (required.has(f.id) && !data[f.id]) { valid = false; el.style.borderColor = '#ef4444'; }
        else if (el.style.borderColor) el.style.borderColor = '';
      }
    }
    if (!valid) return;

    // 移除表单卡片，以用户消息形式展示提交内容
    div.remove();
    const displayParts = fields
      .filter(f => data[f.id])
      .map(f => `${f.label}：${data[f.id]}`);
    appendUserMessage(displayParts.join(' · '));

    // 静默发送结构化数据给后端（不再新增气泡）
    await sendMessage(`__FORM_DATA__:${JSON.stringify(data)}`, true);
  });
}

// 确认对话框
function renderConfirm(spec) {
  const card = document.createElement('div');
  card.className = 'confirm-card';
  let html = '';
  if (spec.context) html += `<p style="font-size:11px;color:#94a3b8;margin-bottom:6px">${escHtml(spec.context)}</p>`;
  html += `<p class="q">${escHtml(spec.question)}</p><div class="confirm-options">`;
  for (const opt of (spec.options || [])) {
    html += `<button class="confirm-option" data-value="${escHtml(opt)}">${escHtml(opt)}</button>`;
  }
  html += '</div>';
  if (spec.allow_other !== false) {
    html += `<div class="confirm-other-wrap">
      <input type="text" placeholder="其他（请填写）…" id="confirm-other-input">
      <button id="confirm-other-btn">确认</button>
    </div>`;
  }
  card.innerHTML = html;
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.appendChild(card);
  messagesEl.appendChild(div);
  scrollBottom();

  const choose = (value) => {
    // 移除选项卡片，以用户消息形式展示选择
    div.remove();
    sendMessage(value);
  };
  card.querySelectorAll('.confirm-option').forEach(btn => {
    btn.addEventListener('click', () => choose(btn.dataset.value));
  });
  const otherBtn = card.querySelector('#confirm-other-btn');
  if (otherBtn) {
    otherBtn.addEventListener('click', () => {
      const val = card.querySelector('#confirm-other-input').value.trim();
      if (val) choose(val);
    });
  }
}

// 线索成功（静默上报 CRM，UI 由 agent 回复承担）
function renderLeadSuccess(data) {
  fetch(`${TRACKER_BASE}/api/crm/lead`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...data, session_id: sessionId, visitor_id: visitorId }),
  }).catch(() => {});
}

// ── 人工服务模式 ─────────────────────────────────────────────────
function setHumanMode(on) {
  humanServing = on;
  humanBanner.classList.toggle('show', on);
  statusDot.classList.toggle('human', on);
  inputEl.classList.toggle('human-mode', on);
  inputEl.placeholder = on ? '输入消息，人工客服将为您解答…' : '输入消息…';
  document.getElementById('header-title').textContent = on ? 'Anvil 人工客服' : 'Anvil 智能助手';
}

// ── 轮询：始终运行，同步 human_serving 状态 + 坐席回复 ──────────────
// 始终轮询，不依赖本地 humanServing 状态，以便感知坐席从 operator-test 手动接管
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    if (!sessionId) return;
    try {
      const res = await fetch(`${AGENT_BASE}/api/sessions/${sessionId}/messages?after=${lastMsgIdx}`);
      const data = await res.json();

      // 同步坐席回复
      for (const msg of data.messages) {
        if (msg.role === 'operator') {
          appendOperatorMessage(msg.content);
        }
        if (msg.idx > lastMsgIdx) lastMsgIdx = msg.idx;
      }

      // 感知接管：后台 human_serving 变 true（坐席在 operator-test 手动接管）
      if (data.human_serving && !humanServing) {
        setHumanMode(true);
        appendSystemMessage('🤝 人工客服已接入，正在为您服务');
      }
      // 感知归还：坐席交还 AI
      if (!data.human_serving && humanServing) {
        setHumanMode(false);
        appendSystemMessage('✅ AI 助手已恢复服务');
      }
    } catch (_) {}
  }, 2000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ── 发送消息 ─────────────────────────────────────────────────────
async function sendMessage(text, silent = false) {
  if (!text.trim() || !sessionId) return;

  if (!silent && !text.startsWith('__')) {
    appendUserMessage(text);
    if (window.pt_track) window.pt_track('chat_message_sent', { text: text.slice(0, 80) });
  }

  // 人工服务期间：发送后直接显示等待提示（agent 会存储消息）
  if (humanServing && !text.startsWith('__')) {
    sendBtn.disabled = true;
    try {
      await fetch(`${AGENT_BASE}/api/chat/${sessionId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
    } catch (_) {}
    sendBtn.disabled = false;
    return;
  }

  sendBtn.disabled = true;

  let bubble = null;
  let streamText = '';
  let thinkingEl = null;           // 当前思考块 DOM
  const toolCards = {};            // tool_call_id → card DOM

  try {
    const res = await fetch(`${AGENT_BASE}/api/chat/${sessionId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') break;
        let evt;
        try { evt = JSON.parse(raw); } catch { continue; }

        switch (evt.type) {

          // ── 思考过程 ────────────────────────────────────────────
          case 'thinking_delta':
            if (!thinkingEl) thinkingEl = createThinkingBlock();
            thinkingAppend(thinkingEl, evt.delta);
            break;

          case 'thinking_end':
            if (thinkingEl) { thinkingDone(thinkingEl); thinkingEl = null; }
            break;

          // ── 正文流 ──────────────────────────────────────────────
          case 'text_delta':
            if (thinkingEl) { thinkingDone(thinkingEl); thinkingEl = null; }
            if (!bubble) {
              bubble = appendBotMessage('');
              bubble.classList.add('streaming');
            }
            streamText += evt.delta;
            bubble.innerHTML = md2html(streamText);
            bubble.classList.add('streaming');
            scrollBottom();
            break;

          case 'text_end':
            if (bubble) {
              bubble.classList.remove('streaming');
              bubble.innerHTML = md2html(streamText);
            }
            break;

          // ── 工具调用 ────────────────────────────────────────────
          case 'tool_start':
            if (thinkingEl) { thinkingDone(thinkingEl); thinkingEl = null; }
            toolCards[evt.id] = createToolCard(evt.tool, evt.id);
            break;

          case 'tool_args': {
            const card = toolCards[evt.id];
            if (card) toolCardSetArgs(card, evt.args);
            break;
          }

          case 'tool_result': {
            const card = toolCards[evt.id];
            if (card) toolCardSetResult(card, evt.text);
            break;
          }

          // ── 特殊工具结果 ────────────────────────────────────────
          case 'form_show':
            renderForm(evt.data);
            break;

          case 'confirm_show':
            renderConfirm(evt.data);
            break;

          case 'handoff':
            setHumanMode(true);
            appendSystemMessage('🤝 正在为您联系人工客服，请稍候…');
            fetch(`${AGENT_BASE}/api/sessions/${sessionId}/handoff`, { method: 'POST' }).catch(() => {});
            break;

          case 'lead_captured':
            renderLeadSuccess(evt.data);
            break;

          case 'human_serving':
            setHumanMode(true);
            break;

          case 'message_stored':
            break;

          case 'error':
            appendSystemMessage(`⚠️ 出现错误：${evt.message}`);
            break;

          case 'done':
            if (thinkingEl) { thinkingDone(thinkingEl); thinkingEl = null; }
            if (bubble) {
              bubble.classList.remove('streaming');
              bubble.innerHTML = md2html(streamText);
            }
            // 未收到 tool_result 的卡片标记为完成（特殊工具如 form/confirm）
            for (const card of Object.values(toolCards)) {
              const spinner = card.querySelector('.tool-spinner');
              if (spinner) {
                spinner.remove();
                card.querySelector('.tool-status').textContent = '✅ 完成';
              }
            }
            break;
        }
      }
    }
  } catch (err) {
    appendSystemMessage(`⚠️ 连接失败：${err.message}。请确认 agent-backend 已启动（端口 8001）。`);
  }

  sendBtn.disabled = false;
}

// ── 辅助 ─────────────────────────────────────────────────────────
function hideQuickReplies() {
  if (quickRepliesShown) { qrContainer.style.display = 'none'; quickRepliesShown = false; }
}

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

// ── 事件绑定 ─────────────────────────────────────────────────────
sendBtn.addEventListener('click', () => {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  inputEl.style.height = '';
  sendMessage(text);
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

document.querySelectorAll('.qr-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.action === 'lead') {
      renderForm({
        title: '留下联系方式',
        intro: '填写后，我们的顾问会在 1 个工作日内与您联系，为您安排专属演示或报价。',
        fields: [
          { id: 'name',    label: '姓名',   type: 'text',   placeholder: '您的姓名' },
          { id: 'phone',   label: '手机号', type: 'tel',    placeholder: '+86 手机号' },
          { id: 'email',   label: '邮箱',   type: 'email',  placeholder: '邮箱地址（选填）' },
          { id: 'company', label: '公司名称', type: 'text', placeholder: '公司名称（选填）' },
          { id: 'requirement', label: '需求描述', type: 'textarea', placeholder: '简单描述您的需求（选填）' },
        ],
        required_fields: ['name', 'phone'],
      });
    } else {
      sendMessage(btn.dataset.value);
    }
  });
});

// "切回 AI"按钮（Demo 用，正式应由坐席在 N2 操作）
document.getElementById('btn-ask-ai').addEventListener('click', async () => {
  if (!sessionId) return;
  await fetch(`${AGENT_BASE}/api/sessions/${sessionId}/ai_resume`, { method: 'POST' }).catch(() => {});
  setHumanMode(false);
  appendSystemMessage('✅ AI 助手已恢复服务');
});

// ── 启动 ─────────────────────────────────────────────────────────
initSession().then(() => startPolling());
</script>
