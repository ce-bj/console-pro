<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Operator Test — N2 坐席工作台</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; font-size: 13px; background: #f5f6fa; color: #1a1a2e; }
  .header { background: #1e293b; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 15px; font-weight: 600; }
  .badge { font-size: 11px; background: #6366f1; padding: 2px 8px; border-radius: 10px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 4px; }
  .layout { display: grid; grid-template-columns: 240px 1fr 280px; height: calc(100vh - 44px); overflow: hidden; }

  /* ── Sessions panel ── */
  .sessions { background: #fff; border-right: 1px solid #e5e7eb; overflow-y: auto; }
  .panel-title { padding: 10px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #6b7280; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
  .session-item { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; cursor: pointer; }
  .session-item:hover { background: #f9fafb; }
  .session-item.active { background: #eff6ff; border-left: 3px solid #6366f1; }
  .session-item .sid { font-size: 12px; font-weight: 600; }
  .session-item .meta { font-size: 11px; color: #6b7280; margin-top: 2px; }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 4px; }
  .tag.human { background: #fef3c7; color: #92400e; }
  .tag.ai { background: #d1fae5; color: #065f46; }
  .tag.has-analysis { background: #ede9fe; color: #5b21b6; }
  .empty { padding: 20px 14px; color: #9ca3af; text-align: center; font-size: 12px; }

  /* ── Chat panel ── */
  .chat { display: flex; flex-direction: column; background: #f0f4f8; min-height: 0; }
  .chat-toolbar { padding: 8px 14px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .btn { padding: 5px 12px; border-radius: 6px; border: 1px solid #e5e7eb; cursor: pointer; font-size: 12px; background: #fff; }
  .btn:hover { background: #f3f4f6; }
  .btn.primary { background: #6366f1; color: #fff; border-color: #6366f1; }
  .btn.primary:hover { background: #4f46e5; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ── Message area — same visual language as chat.html ── */
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 84%; }
  .msg.bot      { align-self: flex-start; }
  .msg.user     { align-self: flex-end; flex-direction: row-reverse; }
  .msg.operator { align-self: flex-end; }
  .msg.system   { align-self: center; max-width: 100%; }

  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; background: #dbeafe; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .msg.operator .msg-avatar { background: #fef3c7; }

  .msg-bubble { padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.55; }
  .msg.bot    .msg-bubble { background: #fff; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
  .msg.user   .msg-bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.operator .msg-bubble { background: #f0fdf4; border: 1px solid #bbf7d0; border-bottom-right-radius: 4px; }
  .msg.system .msg-bubble { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; font-size: 12px; border-radius: 8px; text-align: center; }
  .msg-bubble p { margin: 4px 0; }
  .msg-bubble p:first-child { margin-top: 0; }
  .msg-bubble p:last-child  { margin-bottom: 0; }
  .msg-bubble ul, .msg-bubble ol { padding-left: 18px; margin: 4px 0; }
  .msg-bubble li { margin: 2px 0; }
  .msg-bubble strong { font-weight: 600; }
  .msg-bubble em { font-style: italic; }
  .msg-bubble code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; font-family: monospace; font-size: 12px; }
  .msg-bubble h1,.msg-bubble h2,.msg-bubble h3 { font-size: 13px; font-weight: 600; margin: 6px 0 2px; }
  .msg-bubble table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 12px; }
  .msg-bubble th, .msg-bubble td { border: 1px solid #e2e8f0; padding: 4px 8px; text-align: left; }
  .msg-bubble th { background: #f8fafc; font-weight: 600; }
  .msg-label { font-size: 10px; color: #9ca3af; margin-bottom: 2px; padding-left: 2px; }

  /* ── Thinking block (matches chat.html) ── */
  .thinking-block { display: flex; flex-direction: column; background: #faf5ff; border: 1px solid #d8b4fe; border-left: 3px solid #9333ea; border-radius: 10px; margin: 4px 0; max-width: 84%; align-self: flex-start; font-size: 12px; }
  .thinking-header { display: flex; align-items: center; gap: 6px; padding: 6px 10px; cursor: pointer; user-select: none; color: #7e22ce; font-weight: 600; }
  .thinking-header:hover { background: #f3e8ff; }
  .thinking-spinner { width: 10px; height: 10px; border: 2px solid #d8b4fe; border-top-color: #9333ea; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thinking-label { color: #7e22ce; font-weight: 600; }
  .thinking-toggle { font-size: 10px; margin-left: auto; color: #a855f7; }
  .thinking-body { padding: 8px 12px; border-top: 1px solid #e9d5ff; color: #6b21a8; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11.5px; }
  .thinking-block.collapsed .thinking-body { display: none; }

  /* ── Tool card (matches chat.html green style) ── */
  .tool-card { display: flex; flex-direction: column; background: #f0fdf4; border: 1px solid #86efac; border-left: 3px solid #16a34a; border-radius: 10px; margin: 4px 0; font-size: 12px; max-width: 84%; align-self: flex-start; }
  .tool-card.error { background: #fef2f2; border-color: #fca5a5; border-left-color: #dc2626; }
  .tool-card-header { display: flex; align-items: center; gap: 7px; padding: 7px 10px; color: #15803d; font-weight: 600; cursor: pointer; user-select: none; }
  .tool-card.error .tool-card-header { color: #dc2626; }
  .tool-status { margin-left: auto; font-size: 10px; color: #22c55e; }
  .tool-card.error .tool-status { color: #ef4444; }
  .tool-section { border-top: 1px solid #bbf7d0; padding: 6px 10px; display: flex; flex-direction: column; gap: 3px; }
  .tool-card.error .tool-section { border-top-color: #fecaca; }
  .tool-section-label { font-size: 10px; font-weight: 700; color: #15803d; text-transform: uppercase; letter-spacing: .04em; }
  .tool-card.error .tool-section-label { color: #dc2626; }
  .tool-args-text { color: #374151; font-family: ui-monospace, monospace; font-size: 11px; word-break: break-all; }
  .tool-result-header { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .tool-result-header:hover { opacity: .75; }
  .tool-result-body { margin-top: 4px; color: #374151; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow-y: auto; font-size: 11px; font-family: ui-monospace, monospace; }
  .tool-result-body.hidden { display: none; }

  /* ── Form / confirm display (read-only for operator) ── */
  .special-card { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 10px 14px; font-size: 12px; color: #9a3412; max-width: 84%; align-self: flex-start; }
  .special-card .sc-title { font-weight: 600; margin-bottom: 4px; }

  /* ── Input area ── */
  .chat-input { padding: 10px 14px; border-top: 1px solid #e5e7eb; background: #fff; display: flex; gap: 8px; flex-shrink: 0; }
  .chat-input textarea { flex: 1; border: 1px solid #e5e7eb; border-radius: 8px; padding: 7px 10px; font-size: 12px; resize: none; height: 52px; font-family: inherit; line-height: 1.5; }
  .chat-input textarea:focus { outline: none; border-color: #6366f1; }
  .chat-input textarea:disabled { background: #f9fafb; }

  /* ── Analysis panel ── */
  .analysis { background: #fff; border-left: 1px solid #e5e7eb; overflow-y: auto; }
  .section { padding: 12px 14px; border-bottom: 1px solid #f3f4f6; }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #6b7280; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .kv { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .kv label { color: #6b7280; }
  .kv .val { font-weight: 600; }
  .level-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .level-high { background: #fef3c7; color: #92400e; }
  .level-medium { background: #dbeafe; color: #1e40af; }
  .level-low { background: #f3f4f6; color: #6b7280; }
  .progress { height: 6px; background: #f3f4f6; border-radius: 3px; overflow: hidden; margin: 4px 0; }
  .progress-bar { height: 100%; background: #6366f1; border-radius: 3px; transition: width .3s; }
  .suggestion-item { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.5; cursor: pointer; margin-bottom: 6px; }
  .suggestion-item:hover { background: #eff6ff; border-color: #a5b4fc; }
  .suggestion-item .stype { font-size: 10px; color: #6366f1; font-weight: 600; margin-bottom: 3px; }
  .placeholder { color: #9ca3af; font-size: 12px; text-align: center; padding: 10px 0; }
  .refresh-icon { cursor: pointer; color: #6366f1; }
  .demand-spark { color: #a855f7; margin-right: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>🎧 坐席工作台 · Operator Test</h1>
  <span class="badge">agent-backend :8001</span>
  <span style="margin-left:auto;font-size:12px;color:#94a3b8">
    <span class="status-dot" id="healthDot"></span><span id="healthLabel">检查中…</span>
  </span>
</div>

<div class="layout">
  <!-- Sessions -->
  <div class="sessions">
    <div class="panel-title">
      活跃会话
      <button class="btn" onclick="loadSessions()" style="padding:2px 8px;font-size:11px">↻</button>
    </div>
    <div id="sessionList"><div class="empty">暂无会话</div></div>
  </div>

  <!-- Chat -->
  <div class="chat">
    <div class="chat-toolbar">
      <span id="currentSid" style="font-size:12px;color:#6b7280;flex:1">未选择会话</span>
      <button class="btn primary" id="btnHandoff"  onclick="doHandoff()"          disabled>接管</button>
      <button class="btn"         id="btnResume"   onclick="doResume()"           disabled>交还 AI</button>
      <button class="btn"         id="btnRefreshSug" onclick="refreshSuggestions()" disabled>↻ 刷新建议</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="empty" style="align-self:center;margin-top:60px">← 选择左侧会话</div>
    </div>
    <div class="chat-input">
      <textarea id="opInput" placeholder="以坐席身份发送消息…" disabled
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendOperatorMsg();}"></textarea>
      <button class="btn primary" id="btnSend" onclick="sendOperatorMsg()" disabled>发送</button>
    </div>
  </div>

  <!-- Analysis -->
  <div class="analysis">
    <div class="panel-title">AI 副驾</div>

    <div class="section">
      <div class="section-title">需求类型 · 意向打分</div>
      <div class="placeholder" id="analysisPlaceholder">等待分析结果…</div>
      <div id="analysisContent" style="display:none">
        <div class="kv"><label>需求类型</label><div class="val"><span class="demand-spark">✦</span><span id="demandType">—</span></div></div>
        <div class="kv"><label>意向等级</label><div class="val"><span class="level-badge" id="intentLevelBadge">—</span></div></div>
        <div class="kv"><label>意向分</label><div class="val" id="intentScore">—</div></div>
        <div class="progress"><div class="progress-bar" id="intentBar" style="width:0"></div></div>
        <div style="font-size:11px;color:#6b7280;margin-top:6px" id="intentReason">—</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        💡 回复建议
        <span class="refresh-icon" onclick="refreshSuggestions()" title="刷新建议">↻</span>
      </div>
      <div id="suggestionsContent"><div class="placeholder">人工接管后自动生成…</div></div>
    </div>
  </div>
</div>

<script>
const BASE = 'http://localhost:8001';
let currentSid = null;
let pollTimer = null;
let lastTurnSeq = -1;
let lastMsgIdx  = -1;
let humanServingLocal = false;

// ── Tool labels (same as chat.html) ──────────────────────────────────────────
const TOOL_LABELS = {
  rag_search:               { icon: '🔍', name: '检索知识库' },
  web_search:               { icon: '🌐', name: '搜索网络' },
  lead_capture_form:        { icon: '📋', name: '生成留资表单' },
  confirm_dialog:           { icon: '🤔', name: '生成确认选项' },
  request_human_handoff:    { icon: '🤝', name: '联系人工客服' },
  analyze_visitor_intent:   { icon: '🔬', name: '分析访客意向' },
  Skill:                    { icon: '📖', name: '读取技能指南' },
};

// ── Markdown renderer (copied from chat.html) ─────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function inlineFmt(text) {
  return escHtml(text)
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function parseTableRow(line) { return line.split('|').slice(1,-1).map(c=>c.trim()); }
function isSeparatorRow(line) { return /^\|[-:| ]+\|$/.test(line.trim()); }
function md2html(text) {
  const lines = text.split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith('|') && i+1<lines.length && isSeparatorRow(lines[i+1])) {
      const headers = parseTableRow(line); i += 2;
      html += '<table><thead><tr>' + headers.map(h=>`<th>${inlineFmt(h)}</th>`).join('') + '</tr></thead><tbody>';
      while (i<lines.length && lines[i].trim().startsWith('|')) {
        const cells = parseTableRow(lines[i]);
        html += '<tr>' + cells.map(c=>`<td>${inlineFmt(c)}</td>`).join('') + '</tr>'; i++;
      }
      html += '</tbody></table>'; continue;
    }
    const hm = line.match(/^(#{1,3})\s+(.+)$/);
    if (hm) { html += `<h${hm[1].length}>${inlineFmt(hm[2])}</h${hm[1].length}>`; i++; continue; }
    if (/^[-*•] /.test(line)) {
      html += '<ul>';
      while (i<lines.length && /^[-*•] /.test(lines[i])) { html += `<li>${inlineFmt(lines[i].slice(2))}</li>`; i++; }
      html += '</ul>'; continue;
    }
    if (/^\d+\.\s/.test(line)) {
      html += '<ol>';
      while (i<lines.length && /^\d+\.\s/.test(lines[i])) { html += `<li>${inlineFmt(lines[i].replace(/^\d+\.\s/,''))}</li>`; i++; }
      html += '</ol>'; continue;
    }
    if (line.trim()==='') { html += '<br>'; i++; continue; }
    html += `<p>${inlineFmt(line)}</p>`; i++;
  }
  return html;
}

// ── Thinking block helpers (copied from chat.html) ────────────────────────────
function createThinkingBlock(container) {
  const el = document.createElement('div');
  el.className = 'thinking-block collapsed';
  el.innerHTML = `
    <div class="thinking-header">
      <div class="thinking-spinner" style="border-top-color:#a855f7;animation:none"></div>
      <span class="thinking-label">🧠 思考过程</span>
      <span class="thinking-toggle">▸</span>
    </div>
    <div class="thinking-body"></div>`;
  container.appendChild(el);
  el.querySelector('.thinking-header').addEventListener('click', () => {
    el.classList.toggle('collapsed');
    el.querySelector('.thinking-toggle').textContent = el.classList.contains('collapsed') ? '▸' : '▾';
  });
  return el;
}

// ── Tool card helpers (copied from chat.html) ─────────────────────────────────
function createToolCard(toolName, container) {
  const meta = TOOL_LABELS[toolName] || { icon: '⚙️', name: toolName };
  const el = document.createElement('div');
  el.className = 'tool-card';
  el.innerHTML = `
    <div class="tool-card-header" style="cursor:pointer;user-select:none">
      <span>${meta.icon} ${meta.name}</span>
      <span class="tool-status">✅ 完成</span>
      <span class="tool-header-toggle" style="font-size:10px;color:#94a3b8;margin-left:6px">▾</span>
    </div>
    <div class="tool-card-body"></div>`;
  container.appendChild(el);
  const header = el.querySelector('.tool-card-header');
  const body   = el.querySelector('.tool-card-body');
  const toggle = el.querySelector('.tool-header-toggle');
  header.addEventListener('click', () => {
    const hidden = body.style.display === 'none';
    body.style.display = hidden ? '' : 'none';
    toggle.textContent = hidden ? '▾' : '▸';
  });
  return el;
}

function toolCardSetArgs(el, argsStr) {
  let display = argsStr;
  try { display = Object.entries(JSON.parse(argsStr)).map(([k,v])=>`${k}: ${JSON.stringify(v)}`).join('\n'); } catch(_) {}
  const sec = document.createElement('div');
  sec.className = 'tool-section';
  sec.innerHTML = `<div class="tool-section-label">参数</div><div class="tool-args-text">${escHtml(display)}</div>`;
  el.querySelector('.tool-card-body').appendChild(sec);
}

function toolCardSetResult(el, resultText) {
  const sec = document.createElement('div');
  sec.className = 'tool-section';
  const hdr = document.createElement('div');
  hdr.className = 'tool-result-header';
  hdr.innerHTML = `<div class="tool-section-label">结果</div><span style="font-size:10px;color:#15803d;margin-left:auto">▾ 展开</span>`;
  const body = document.createElement('div');
  body.className = 'tool-result-body hidden';
  body.textContent = resultText;
  sec.appendChild(hdr); sec.appendChild(body);
  el.querySelector('.tool-card-body').appendChild(sec);
  hdr.addEventListener('click', (e) => {
    e.stopPropagation();   // don't let it trigger the card-level collapse
    body.classList.toggle('hidden');
    hdr.querySelector('span').textContent = body.classList.contains('hidden') ? '▾ 展开' : '▴ 折叠';
  });
}

// ── Render a full AI turn ─────────────────────────────────────────────────────
function renderTurn(turn, container) {
  // 1. User message
  if (turn.user_msg) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="msg-bubble">${escHtml(turn.user_msg)}</div>`;
    container.appendChild(div);
  }

  // 2. Thinking block (if any)
  if (turn.thinking) {
    const tb = createThinkingBlock(container);
    tb.querySelector('.thinking-body').textContent = turn.thinking;
  }

  // 3. Tool calls
  for (const tc of (turn.tool_calls || [])) {
    const card = createToolCard(tc.tool, container);
    if (tc.args) toolCardSetArgs(card, tc.args);

    if (tc.type === 'form_show') {
      const sc = document.createElement('div');
      sc.className = 'special-card';
      sc.innerHTML = `<div class="sc-title">📋 留资表单已弹出</div>${tc.data?.intro ? escHtml(tc.data.intro) : ''}`;
      container.appendChild(sc);
    } else if (tc.type === 'confirm_show') {
      const sc = document.createElement('div');
      sc.className = 'special-card';
      sc.innerHTML = `<div class="sc-title">🤔 确认选项已弹出</div>${tc.data?.question ? escHtml(tc.data.question) : ''}`;
      container.appendChild(sc);
    } else if (tc.type === 'handoff') {
      const sc = document.createElement('div');
      sc.className = 'msg system';
      sc.innerHTML = `<div class="msg-bubble">🤝 AI 请求转人工：${escHtml(tc.data?.reason || '')}</div>`;
      container.appendChild(sc);
    } else if (tc.result) {
      toolCardSetResult(card, tc.result);
    }
  }

  // 4. AI reply
  if (turn.agent_reply) {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble">${md2html(turn.agent_reply)}</div>`;
    container.appendChild(div);
  }

  // 5. Handoff system msg (from special events, not from tool)
  for (const ev of (turn.special_events || [])) {
    if (ev.type === 'handoff' && !turn.tool_calls.some(t=>t.type==='handoff')) {
      const div = document.createElement('div');
      div.className = 'msg system';
      div.innerHTML = `<div class="msg-bubble">🤝 AI 请求转人工：${escHtml(ev.data?.reason||'')}</div>`;
      container.appendChild(div);
    }
  }
}

// ── Render messages (operator + post-handoff user) ────────────────────────────
function renderMsg(msg, container) {
  const div = document.createElement('div');
  if (msg.role === 'operator') {
    div.className = 'msg operator';
    div.innerHTML = `<div class="msg-avatar">🎧</div><div class="msg-bubble">${escHtml(msg.content)}</div>`;
  } else if (msg.role === 'user') {
    div.className = 'msg user';
    div.innerHTML = `<div class="msg-bubble">${escHtml(msg.content)}</div>`;
  } else {
    return; // agent messages handled by turns
  }
  container.appendChild(div);
}

// ── Load & poll chat data ─────────────────────────────────────────────────────
async function loadChatData(sid, replace = false) {
  const container = document.getElementById('chatMessages');
  if (replace) {
    container.innerHTML = '';
    lastTurnSeq = -1;
    lastMsgIdx  = -1;
  }

  // Fetch turns (AI conversation with thinking + tools)
  try {
    const r = await fetch(`${BASE}/api/sessions/${sid}/turns?after=${lastTurnSeq}`);
    const d = await r.json();
    for (const turn of d.turns) {
      renderTurn(turn, container);
      lastTurnSeq = Math.max(lastTurnSeq, turn.seq);
    }
  } catch (_) {}

  // Fetch messages (operator replies + user messages during human serving)
  // Use a high user_msg_idx threshold to skip user messages already in turns
  try {
    const r = await fetch(`${BASE}/api/sessions/${sid}/messages?after=${lastMsgIdx}`);
    const d = await r.json();
    for (const msg of d.messages) {
      // Show operator messages always; show user messages only during human serving
      if (msg.role === 'operator' || (msg.role === 'user' && humanServingLocal)) {
        renderMsg(msg, container);
      }
      if (msg.idx > lastMsgIdx) lastMsgIdx = msg.idx;
    }
    // Sync human_serving state
    if (d.human_serving !== humanServingLocal) {
      humanServingLocal = d.human_serving;
      updateHumanBadge();
    }
  } catch (_) {}

  container.scrollTop = container.scrollHeight;
}

function updateHumanBadge() {
  const sid = currentSid;
  document.getElementById('currentSid').textContent =
    `会话: ${sid}` + (humanServingLocal ? ' · 🟡 人工接管中' : '');
}

// ── Session list ──────────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch(`${BASE}/health`);
    const d = await r.json();
    document.getElementById('healthDot').style.background = '#22c55e';
    document.getElementById('healthLabel').textContent = `正常 (${d.sessions} 个会话)`;
  } catch {
    document.getElementById('healthDot').style.background = '#ef4444';
    document.getElementById('healthLabel').textContent = '无法连接';
  }
}

async function loadSessions() {
  checkHealth();
  try {
    const r = await fetch(`${BASE}/api/sessions`);
    const d = await r.json();
    renderSessions(d.sessions);
  } catch(e) {
    document.getElementById('sessionList').innerHTML = `<div class="empty">连接失败: ${e.message}</div>`;
  }
}

function renderSessions(sessions) {
  const el = document.getElementById('sessionList');
  if (!sessions.length) { el.innerHTML = '<div class="empty">暂无会话</div>'; return; }
  el.innerHTML = sessions.map(s => `
    <div class="session-item ${s.session_id===currentSid?'active':''}" onclick="selectSession('${s.session_id}')">
      <div class="sid">${s.session_id}
        <span class="tag ${s.human_serving?'human':'ai'}">${s.human_serving?'人工':'AI'}</span>
        ${s.analysis?'<span class="tag has-analysis">已分析</span>':''}
      </div>
      <div class="meta">${s.user_type} · ${s.msg_count} 条消息</div>
      ${s.analysis?`<div class="meta" style="color:#6366f1">${s.analysis.demand_type||'—'} · ${s.analysis.intent_score??'?'}分</div>`:''}
    </div>
  `).join('');
}

// ── Select session ────────────────────────────────────────────────────────────
async function selectSession(sid) {
  currentSid = sid;
  humanServingLocal = false;

  ['btnHandoff','btnResume','btnRefreshSug','opInput','btnSend'].forEach(id => {
    document.getElementById(id).disabled = false;
  });

  if (pollTimer) clearInterval(pollTimer);

  await loadChatData(sid, true);
  await loadAnalysis(sid);
  await loadSuggestions(sid);
  loadSessions();

  pollTimer = setInterval(async () => {
    await loadChatData(sid);
    await loadAnalysis(sid);
    if (humanServingLocal) await loadSuggestions(sid);
    loadSessions();
  }, 2000);
}

// ── Analysis ──────────────────────────────────────────────────────────────────
async function loadAnalysis(sid) {
  try {
    const r = await fetch(`${BASE}/api/sessions/${sid}/analysis`);
    const d = await r.json();
    renderAnalysis(d.analysis);
  } catch(_) {}
}
function renderAnalysis(a) {
  const ph = document.getElementById('analysisPlaceholder');
  const ct = document.getElementById('analysisContent');
  if (!a) { ph.style.display=''; ct.style.display='none'; return; }
  ph.style.display='none'; ct.style.display='';
  document.getElementById('demandType').textContent = a.demand_type||'—';
  document.getElementById('intentScore').textContent = a.intent_score??'—';
  document.getElementById('intentReason').textContent = a.intent_reason||'';
  document.getElementById('intentBar').style.width = `${a.intent_score??0}%`;
  const lvl = a.intent_level||'low';
  const badge = document.getElementById('intentLevelBadge');
  badge.textContent = {high:'高意向',medium:'中意向',low:'低意向'}[lvl]||lvl;
  badge.className = `level-badge level-${lvl}`;
}

// ── Suggestions ───────────────────────────────────────────────────────────────
async function loadSuggestions(sid) {
  try {
    const r = await fetch(`${BASE}/api/sessions/${sid}/reply-suggestions`);
    const d = await r.json();
    renderSuggestions(d.suggestions, d.human_serving);
  } catch(_) {}
}
const SUG_TYPES = ['📋 答疑型','🎯 引导型','💙 共鸣型'];
function renderSuggestions(suggestions, human) {
  const el = document.getElementById('suggestionsContent');
  if (!human) { el.innerHTML='<div class="placeholder">人工接管后自动生成…</div>'; return; }
  if (!suggestions||!suggestions.length) { el.innerHTML='<div class="placeholder">分析中，请稍候…</div>'; return; }
  el.innerHTML = suggestions.map((s,i)=>`
    <div class="suggestion-item" onclick="fillInput(this.querySelector('.text').textContent)">
      <div class="stype">${SUG_TYPES[i]||''}</div>
      <div class="text">${escHtml(s)}</div>
    </div>`).join('');
}
function fillInput(text) {
  const ta = document.getElementById('opInput');
  ta.value = text; ta.focus();
}

// ── Operator actions ──────────────────────────────────────────────────────────
async function doHandoff() {
  if (!currentSid) return;
  await fetch(`${BASE}/api/sessions/${currentSid}/handoff`, { method: 'POST' });
  humanServingLocal = true;
  updateHumanBadge();
  await loadSuggestions(currentSid);
  loadSessions();
}
async function doResume() {
  if (!currentSid) return;
  await fetch(`${BASE}/api/sessions/${currentSid}/ai_resume`, { method: 'POST' });
  humanServingLocal = false;
  updateHumanBadge();
  document.getElementById('suggestionsContent').innerHTML='<div class="placeholder">人工接管后自动生成…</div>';
  loadSessions();
}
async function refreshSuggestions() {
  if (!currentSid) return;
  await fetch(`${BASE}/api/sessions/${currentSid}/reply-suggestions/refresh`, { method: 'POST' });
  document.getElementById('suggestionsContent').innerHTML='<div class="placeholder">重新生成中…</div>';
  setTimeout(()=>loadSuggestions(currentSid), 3000);
}
async function sendOperatorMsg() {
  const ta = document.getElementById('opInput');
  const content = ta.value.trim();
  if (!content || !currentSid) return;
  ta.value = '';
  const res = await fetch(`${BASE}/api/sessions/${currentSid}/operator_message`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ content }),
  });
  const data = await res.json();
  // Advance lastMsgIdx so the polling loop skips this message (prevent duplicate render)
  if (data.idx != null && data.idx > lastMsgIdx) lastMsgIdx = data.idx;
  // Immediately render locally for instant feedback
  const container = document.getElementById('chatMessages');
  renderMsg({ role: 'operator', content }, container);
  container.scrollTop = container.scrollHeight;
}

// ── Init ──────────────────────────────────────────────────────────────────────
checkHealth();
loadSessions();
setInterval(loadSessions, 5000);
</script>
